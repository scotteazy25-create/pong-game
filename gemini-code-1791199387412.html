<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pong Online Super Edition — играй с другом</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(ellipse at center, #12122a 0%, #06060f 100%);
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 16px;
  }
  #app { width: 100%; max-width: 860px; position: relative; }
  .screen { display: none; text-align: center; animation: fade .35s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  h1 {
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00f0ff, #ff00e0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 24px rgba(0, 240, 255, .35));
  }
  h2 { font-size: 1.5rem; margin-bottom: 14px; color: #9be9ff; }
  .sub { color: #7a7a99; margin-bottom: 32px; font-size: .95rem; letter-spacing: 1px; }

  .btn {
    display: inline-block;
    padding: 15px 36px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    background: linear-gradient(135deg, #00f0ff, #0090ff);
    color: #04101a;
    transition: transform .15s, box-shadow .2s;
    box-shadow: 0 6px 24px rgba(0, 240, 255, .3);
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0, 240, 255, .45); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.ghost {
    background: transparent;
    color: #6a6a8a;
    box-shadow: none;
    border: 1px solid #2a2a44;
    padding: 10px 24px;
    font-size: .85rem;
    margin-top: 18px;
  }
  .btn.ghost:hover { color: #fff; border-color: #44446a; }

  .divider {
    margin: 26px 0;
    color: #3a3a5a;
    font-size: .8rem;
    letter-spacing: 3px;
    position: relative;
  }
  .divider::before, .divider::after {
    content: ''; position: absolute; top: 50%; width: 38%; height: 1px;
    background: linear-gradient(90deg, transparent, #2a2a44, transparent);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .join-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #codeInput {
    background: #12122a;
    border: 1px solid #2a2a44;
    border-radius: 12px;
    padding: 15px 18px;
    color: #fff;
    font-size: 1.3rem;
    font-family: 'Courier New', monospace;
    letter-spacing: 6px;
    text-align: center;
    text-transform: uppercase;
    width: 200px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #codeInput:focus { border-color: #00f0ff; box-shadow: 0 0 0 3px rgba(0, 240, 255, .15); }
  #codeInput::placeholder { letter-spacing: 3px; color: #3a3a5a; font-size: 1rem; }

  .code {
    font-family: 'Courier New', monospace;
    font-size: clamp(2.4rem, 12vw, 4rem);
    font-weight: 700;
    letter-spacing: 12px;
    padding: 18px 0 18px 12px;
    margin: 14px auto 18px;
    color: #00f0ff;
    text-shadow: 0 0 30px rgba(0, 240, 255, .6);
    border: 2px dashed #1e3a52;
    border-radius: 16px;
    max-width: 380px;
    background: rgba(0, 240, 255, .04);
  }
  .hint { color: #5a5a7a; font-size: .85rem; margin-top: 26px; }
  .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
    background: #06060f;
    border: 1px solid #1a1a30;
    box-shadow: 0 0 70px rgba(0, 240, 255, .12), 0 0 120px rgba(255, 0, 224, .08);
    touch-action: none;
    cursor: none;
  }
  .status {
    margin-top: 14px;
    font-size: .85rem;
    letter-spacing: 2px;
    color: #5a5a7a;
    text-transform: uppercase;
  }
  .cyan { color: #00f0ff; text-shadow: 0 0 12px rgba(0,240,255,.7); font-weight: 700; }
  .magenta { color: #ff00e0; text-shadow: 0 0 12px rgba(255,0,224,.7); font-weight: 700; }

  .audio-toggle {
    position: absolute;
    top: -40px;
    right: 0;
    background: transparent;
    border: none;
    color: #7a7a99;
    font-size: 1.2rem;
    cursor: pointer;
  }

  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a30;
    border: 1px solid #2a2a44;
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: .9rem;
    transition: transform .3s ease;
    z-index: 100;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- МЕНЮ -->
  <div id="menu" class="screen active">
    <h1>PONG ONLINE</h1>
    <p class="sub">Играй с другом на расстоянии</p>
    <button class="btn" id="createBtn">СОЗДАТЬ ИГРУ</button>
    <div class="divider">ИЛИ</div>
    <div class="join-row">
      <input id="codeInput" maxlength="5" placeholder="КОД" autocomplete="off" spellcheck="false">
      <button class="btn" id="joinBtn">ВОЙТИ</button>
    </div>
  </div>

  <!-- ОЖИДАНИЕ -->
  <div id="waiting" class="screen">
    <h2>Комната создана</h2>
    <p class="sub" style="margin-bottom:0">Отправь другу этот код</p>
    <div class="code" id="roomCode">-----</div>
    <button class="btn" id="copyBtn">СКОПИРОВАТЬ КОД</button>
    <p class="hint">Ожидание подключения<span class="dots"></span></p>
    <button class="btn ghost" id="cancelBtn">Отмена</button>
  </div>

  <!-- ИГРА -->
  <div id="gameScreen" class="screen">
    <div class="canvas-wrapper">
      <button class="audio-toggle" id="audioBtn" title="Переключить звук">🔊</button>
      <canvas id="game" width="800" height="500"></canvas>
    </div>
    <div class="status" id="status"></div>
    <button class="btn ghost" id="leaveBtn">ПОКИНУТЬ ИГРУ</button>
  </div>

</div>
<div id="toast"></div>

<!-- PeerJS CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Константы ----------
  const W = 800, H = 500;
  const PW = 14, PH = 90;
  const P1X = 30;
  const P2X = W - 30 - PW;
  const WIN_SCORE = 7;
  const PREFIX = 'pongv1-';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const screens = {
    menu: $('menu'),
    waiting: $('waiting'),
    game: $('gameScreen')
  };
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const statusEl = $('status');
  const codeInput = $('codeInput');
  const roomCodeEl = $('roomCode');
  const toastEl = $('toast');
  const audioBtn = $('audioBtn');

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  // ---------- Web Audio API (Звуковые эффекты) ----------
  let audioEnabled = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(freq, type = 'sine', duration = 0.1) {
    if (!audioEnabled) return;
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  audioBtn.addEventListener('click', () => {
    audioEnabled = !audioEnabled;
    audioBtn.textContent = audioEnabled ? '🔊' : '🔇';
  });

  // ---------- Состояние и Физика ----------
  let peer = null;
  let conn = null;
  let isHost = false;
  let running = false;

  let state = null;
  let localPaddleY = H / 2;
  let remoteP2 = H / 2;
  let serveTimer = 0;
  let overTimer = 0;
  let frame = 0;

  // Визуальные эффекты (Частицы и Вспышки)
  let particles = [];
  let trail = [];
  let shakeTime = 0;

  function addParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        color,
        life: 1.0,
        size: Math.random() * 4 + 2
      });
    }
  }

  function freshState() {
    return {
      ball: { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 10 },
      p1: H / 2,
      p2: H / 2,
      s1: 0,
      s2: 0,
      over: false,
      winner: 0
    };
  }

  // ---------- PeerJS Конфигурация ----------
  const peerConfig = {
    debug: 0,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    }
  };

  function shortId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function hostGame() {
    const code = shortId();
    peer = new Peer(PREFIX + code, peerConfig);

    peer.on('open', () => {
      roomCodeEl.textContent = code;
      showScreen('waiting');
    });

    peer.on('connection', c => {
      if (conn && conn.open) { c.close(); return; }
      conn = c;
      conn.on('open', () => {
        isHost = true;
        bindConn();
        startGame();
      });
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        toast('Код занят, пробуем снова…');
        peer.destroy();
        hostGame();
      } else {
        toast('Ошибка соединения: ' + err.type);
        backToMenu();
      }
    });
  }

  function joinGame(rawCode) {
    const code = rawCode.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 5) { toast('Код должен состоять из 5 символов'); return; }

    peer = new Peer(peerConfig);

    peer.on('open', () => {
      const c = peer.connect(PREFIX + code, { reliable: true });
      conn = c;

      const timeout = setTimeout(() => {
        if (!conn || !conn.open) {
          toast('Не удалось подключиться. Проверь код.');
          backToMenu();
        }
      }, 15000);

      c.on('open', () => {
        clearTimeout(timeout);
        isHost = false;
        bindConn();
        startGame();
      });
    });

    peer.on('error', err => {
      toast('Ошибка подключения: ' + err.type);
      backToMenu();
    });
  }

  function bindConn() {
    conn.on('data', onData);
    conn.on('close', () => {
      if (running) { toast('Соперник отключился'); backToMenu(); }
    });
  }

  function onData(data) {
    if (!data || typeof data !== 'object') return;

    if (isHost) {
      if (data.t === 'input') remoteP2 = data.y;
    } else {
      if (data.t === 'state') {
        const keepP2 = state ? state.p2 : H / 2;
        state = data.s;
        state.p2 = keepP2;
      }
    }
  }

  function backToMenu() {
    running = false;
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    isHost = false;
    state = null;
    showScreen('menu');
  }

  // ---------- Логика Игры ----------
  function startGame() {
    state = freshState();
    localPaddleY = H / 2;
    remoteP2 = H / 2;
    frame = 0;
    overTimer = 0;
    particles = [];
    trail = [];

    statusEl.innerHTML = isHost
      ? 'Ты — <span class="cyan">левый игрок</span> · Управление: Мышь / WASD / Стрелки'
      : 'Ты — <span class="magenta">правый игрок</span> · Управление: Мышь / WASD / Стрелки';

    showScreen('game');

    if (isHost) serveTimer = 90;
    running = true;
    requestAnimationFrame(loop);
  }

  function resetBall() {
    state.ball.x = W / 2;
    state.ball.y = H / 2;
    state.ball.vx = 0;
    state.ball.vy = 0;
    serveTimer = 70;
  }

  function serve() {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const speed = 6.8;
    const angle = (Math.random() * 0.7 - 0.35);
    state.ball.vx = dir * speed * Math.cos(angle);
    state.ball.vy = speed * Math.sin(angle) * 1.6;
    playSound(440, 'triangle');
  }

  function clampSpeed() {
    const b = state.ball;
    const max = 17;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; }
  }

  function update() {
    if (state.over) {
      overTimer--;
      if (overTimer <= 0) {
        state.s1 = 0;
        state.s2 = 0;
        state.over = false;
        state.winner = 0;
        resetBall();
      }
      return;
    }

    state.p2 += (remoteP2 - state.p2) * 0.5;

    if (serveTimer > 0) {
      serveTimer--;
      if (serveTimer === 0) serve();
      return;
    }

    const b = state.ball;
    b.x += b.vx;
    b.y += b.vy;

    // Отрезок траектории для следа
    if (frame % 2 === 0) {
      trail.push({ x: b.x, y: b.y, alpha: 1.0 });
      if (trail.length > 12) trail.shift();
    }

    // Отскок от верхних/нижних стен
    if (b.y - b.r < 0) {
      b.y = b.r; b.vy = -b.vy;
      playSound(300, 'sine');
      addParticles(b.x, b.y, '#ffffff');
    }
    if (b.y + b.r > H) {
      b.y = H - b.r; b.vy = -b.vy;
      playSound(300, 'sine');
      addParticles(b.x, b.y, '#ffffff');
    }

    // Левая ракетка (P1)
    if (b.vx < 0 && b.x - b.r <= P1X + PW && b.x - b.r >= P1X - 10) {
      if (b.y >= state.p1 - PH / 2 - b.r && b.y <= state.p1 + PH / 2 + b.r) {
        b.x = P1X + PW + b.r;
        const rel = Math.max(-1, Math.min(1, (b.y - state.p1) / (PH / 2)));
        b.vx = Math.abs(b.vx) * 1.06;
        b.vy = b.vy * 0.5 + rel * 5.5;
        clampSpeed();
        playSound(587.33, 'square');
        addParticles(b.x, b.y, '#00f0ff');
        shakeTime = 6;
      }
    }

    // Правая ракетка (P2)
    if (b.vx > 0 && b.x + b.r >= P2X && b.x + b.r <= P2X + PW + 10) {
      if (b.y >= state.p2 - PH / 2 - b.r && b.y <= state.p2 + PH / 2 + b.r) {
        b.x = P2X - b.r;
        const rel = Math.max(-1, Math.min(1, (b.y - state.p2) / (PH / 2)));
        b.vx = -Math.abs(b.vx) * 1.06;
        b.vy = b.vy * 0.5 + rel * 5.5;
        clampSpeed();
        playSound(659.25, 'square');
        addParticles(b.x, b.y, '#ff00e0');
        shakeTime = 6;
      }
    }

    // Голы
    if (b.x < -30) {
      state.s2++;
      playSound(220, 'sawtooth', 0.3);
      if (state.s2 >= WIN_SCORE) { endGame(2); return; }
      resetBall();
    } else if (b.x > W + 30) {
      state.s1++;
      playSound(220, 'sawtooth', 0.3);
      if (state.s1 >= WIN_SCORE) { endGame(1); return; }
      resetBall();
    }
  }

  function endGame(winner) {
    state.over = true;
    state.winner = winner;
    overTimer = 220;
    state.ball.vx = 0;
    state.ball.vy = 0;
    playSound(880, 'sine', 0.5);
  }

  // ---------- Отрисовка ----------
  function render() {
    ctx.save();

    // Эффект встряски (Screen Shake)
    if (shakeTime > 0) {
      shakeTime--;
      ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    }

    ctx.clearRect(0, 0, W, H);

    // Фон
    ctx.fillStyle = '#06060f';
    ctx.fillRect(0, 0, W, H);

    // Центральная линия
    ctx.setLineDash([12, 16]);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    if (!state) { ctx.restore(); return; }

    // Траектория / След мяча
    for (let i = 0; i < trail.length; i++) {
      const pt = trail[i];
      ctx.fillStyle = `rgba(0, 240, 255, ${ (i / trail.length) * 0.35 })`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, state.ball.r * (i / trail.length), 0, Math.PI * 2);
      ctx.fill();
    }

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1.0;

    // Ракетки
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    roundRect(P1X, state.p1 - PH / 2, PW, PH, 7);

    ctx.fillStyle = '#ff00e0';
    ctx.shadowColor = '#ff00e0';
    roundRect(P2X, state.p2 - PH / 2, PW, PH, 7);

    // Мяч
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 28;
    ctx.beginPath();
    ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Счёт
    ctx.font = 'bold 66px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0, 240, 255, 0.28)';
    ctx.fillText(state.s1, W / 2 - 90, 72);
    ctx.fillStyle = 'rgba(255, 0, 224, 0.28)';
    ctx.fillText(state.s2, W / 2 + 90, 72);

    // Экран победы
    if (state.over) {
      ctx.fillStyle = 'rgba(4, 6, 16, 0.82)';
      ctx.fillRect(0, 0, W, H);

      const iWon = (isHost && state.winner === 1) || (!isHost && state.winner === 2);
      ctx.font = 'bold 52px "Segoe UI", sans-serif';
      ctx.fillStyle = iWon ? '#00f0ff' : '#ff00e0';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 40;
      ctx.fillText(iWon ? '🏆 ТЫ ПОБЕДИЛ!' : 'ТЫ ПРОИГРАЛ', W / 2, H / 2 - 18);
      ctx.shadowBlur = 0;

      ctx.font = '20px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('Новый раунд через мгновение…', W / 2, H / 2 + 52);
    }

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- Цикл Обработки ----------
  function loop() {
    if (!running) return;
    frame++;

    if (isHost) {
      state.p1 = localPaddleY;
      update();
      if (frame % 2 === 0 && conn && conn.open) {
        conn.send({
          t: 'state',
          s: {
            ball: { x: state.ball.x, y: state.ball.y, vx: state.ball.vx, vy: state.ball.vy, r: state.ball.r },
            p1: state.p1,
            p2: state.p2,
            s1: state.s1,
            s2: state.s2,
            over: state.over,
            winner: state.winner
          }
        });
      }
    } else {
      state.p2 = localPaddleY;
      if (frame % 2 === 0 && conn && conn.open) {
        conn.send({ t: 'input', y: localPaddleY });
      }
    }

    render();
    requestAnimationFrame(loop);
  }

  // ---------- Управление ----------
  const keys = {};

  function clampPaddle(v) {
    return Math.max(PH / 2, Math.min(H - PH / 2, v));
  }

  function pointerMove(clientY) {
    const rect = canvas.getBoundingClientRect();
    const scale = H / rect.height;
    localPaddleY = clampPaddle((clientY - rect.top) * scale);
  }

  canvas.addEventListener('mousemove', e => {
    if (!running) return;
    pointerMove(e.clientY);
  });

  canvas.addEventListener('touchstart', e => {
    if (!running) return;
    e.preventDefault();
    initAudio();
    pointerMove(e.touches[0].clientY);
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (!running) return;
    e.preventDefault();
    pointerMove(e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('keydown', e => {
    initAudio();
    keys[e.key] = true;
    if (['ArrowUp', 'ArrowDown', ' '].includes(e.key) && running) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  setInterval(() => {
    if (!running) return;
    let dy = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W'] || keys['ц'] || keys['Ц']) dy -= 9.5;
    if (keys['ArrowDown'] || keys['s'] || keys['S'] || keys['ы'] || keys['Ы']) dy += 9.5;
    if (dy !== 0) localPaddleY = clampPaddle(localPaddleY + dy);
  }, 1000 / 60);

  // ---------- Инициализация UI ----------
  $('createBtn').addEventListener('click', () => {
    initAudio();
    $('createBtn').disabled = true;
    hostGame();
    setTimeout(() => { $('createBtn').disabled = false; }, 1500);
  });

  $('joinBtn').addEventListener('click', () => {
    initAudio();
    const code = codeInput.value.trim();
    if (code.length < 5) { toast('Введи 5-символьный код'); return; }
    $('joinBtn').disabled = true;
    joinGame(code);
    setTimeout(() => { $('joinBtn').disabled = false; }, 3000);
  });

  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') $('joinBtn').click();
  });

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  $('copyBtn').addEventListener('click', async () => {
    const code = roomCodeEl.textContent;
    try {
      await navigator.clipboard.writeText(code);
      toast('Код скопирован!');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('Код скопирован!');
    }
  });

  $('cancelBtn').addEventListener('click', backToMenu);$('leaveBtn').addEventListener('click', backToMenu);

  window.addEventListener('beforeunload', () => {
    if (conn) try { conn.close(); } catch (e) {}
    if (peer) try { peer.destroy(); } catch (e) {}
  });

})();
</script>
</body>
</html>
